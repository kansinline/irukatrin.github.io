<script>
/* ===============================
   API設定
=============================== */
const API_URL = "https://irukarailwayapi.onrender.com/trains"; // ← 実際のAPIに変更する

/* ===============================
   API取得
=============================== */
async function fetchStatus() {
  try {
    const res = await fetch(API_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("API error");
    return await res.json();
  } catch (e) {
    console.error("運行情報取得失敗", e);
    return [];
  }
}

/* ===============================
   状態 → クラス
=============================== */
function getStatusClass(status) {
  if (status === "遅延") return "status-delay";
  if (status === "運転見合わせ") return "status-stop";
  return "status-info";
}

/* ===============================
   描画処理
=============================== */
async function renderBoard() {
  const data = await fetchStatus();
  const wrapper = document.getElementById("board-wrapper");
  const board = document.getElementById("board");

  board.innerHTML = "";
  board.className = "";

  // 平常運行は非表示
  const targets = data.filter(
    d => d.status !== "平常運行" && d.status !== "平常運転"
  );

  // 表示対象なし
  if (targets.length === 0) {
    wrapper.style.display = "none";
    return;
  }

  wrapper.style.display = "flex";

  targets.forEach(item => {
    const div = document.createElement("div");
    div.className = `board-item ${getStatusClass(item.status)}`;
    div.textContent = `${item.name}　${item.status}`;
    board.appendChild(div);
  });

  // 動作切替
  if (targets.length === 1) {
    board.classList.add("blink");
  } else {
    board.classList.add("scroll");
  }
}

/* ===============================
   初期表示＋自動更新
=============================== */
renderBoard();
setInterval(renderBoard, 30000); // 30秒ごとに更新
/* ===============================
   お知らせとリリースをAPIから取得
================================ */
async function loadAllDataFromAPI() {
  const newsContainer = document.getElementById("news");
  const releaseContainer = document.getElementById("release");
  
  try {
    // APIからデータを取得
    // ※URLは自分のNode.jsサーバーのURLに変えてね！
    const response = await fetch("https://irukarailwayapi.onrender.com/api/info");
    const data = await response.json();

    // --- 1. お知らせ(news)の処理 ---
    newsContainer.innerHTML = "";
    const newsUl = document.createElement("ul");
    newsUl.style.listStyle = "none";
    newsUl.style.padding = "0";

    data.news.forEach(item => {
      const li = document.createElement("li");
      li.style.padding = "10px 0";
      li.style.borderBottom = "1px solid #eee";
      li.innerHTML = `
        <small style="color: #888; display: block;">${item.date}</small>
        <a href="${item.link}" style="color: #0055aa; text-decoration: none; font-weight: bold;">${item.title}</a>
      `;
      newsUl.appendChild(li);
    });
    newsContainer.appendChild(newsUl);

    // --- 2. ニュースリリース(release)の処理 ---
    releaseContainer.innerHTML = "";
    const releaseUl = document.createElement("ul");
    releaseUl.style.listStyle = "none";
    releaseUl.style.padding = "0";

    data.releases.forEach(item => {
      const li = document.createElement("li");
      li.style.padding = "10px 0";
      li.style.borderBottom = "1px solid #eee";
      li.innerHTML = `
        <small style="color: #888; display: block;">${item.date}</small>
        <a href="${item.link}" style="color: #444; text-decoration: none;">【プレスリリース】${item.title}</a>
      `;
      releaseUl.appendChild(li);
    });
    releaseContainer.appendChild(releaseUl);

  } catch (err) {
    console.error("データ取得失敗:", err);
    newsContainer.innerHTML = "<p>お知らせの読み込みに失敗しました。</p>";
    releaseContainer.innerHTML = "<p>リリースの読み込みに失敗しました。</p>";
  }
}

// 実行
loadAllDataFromAPI();





/* ===============================
   スライダー：スワイプ対応
================================ */
let startX = 0;
let isSwiping = false;

const slider = document.getElementById("slider");

slider.addEventListener("touchstart", function (e) {
  startX = e.touches[0].clientX;
  isSwiping = true;
  stopAutoSlide();
});

slider.addEventListener("touchmove", function (e) {
  if (!isSwiping) return;
  const diff = e.touches[0].clientX - startX;

  // 少しでも横移動したらスクロール防止
  if (Math.abs(diff) > 10) {
    e.preventDefault();
  }
}, { passive: false });

slider.addEventListener("touchend", function (e) {
  if (!isSwiping) return;

  const endX = e.changedTouches[0].clientX;
  const diff = endX - startX;

  if (diff > 50) {
    slidePrev(); // 右スワイプ
  } else if (diff < -50) {
    slideNext(); // 左スワイプ
  }

  isSwiping = false;
  startAutoSlide();
});

async function checkTrainStatus() {
  try {
    const response = await fetch("https://irukarailwayapi.onrender.com/trains");
    const trains = await response.json();

    const box = document.getElementById("rail-status-box");
    const statusText = document.getElementById("rail-status");

    if (!box || !statusText) return;

    // ステータスごとの判定
    const hasCancel = trains.some(train => train.status && train.status.includes("運休"));
    const hasDelay = trains.some(train => train.status && train.status.includes("遅延"));
    const hasSuspension = trains.some(train => train.status && train.status.includes("運転見合わせ"));

    // まず既存のアイコンを削除
    statusText.querySelector("img")?.remove();

    if (hasSuspension) {
      // 運転見合わせ
      statusText.innerHTML = "⛔ 運転見合わせがあります。";
      box.style.backgroundColor = "#ffe6cc"; // 薄オレンジ
      box.style.borderColor = "#ff9933";     // 濃オレンジ
    } else if (hasCancel) {
      // 運休あり
      statusText.innerHTML = "❌ 一部の列車が運休しています。";
      box.style.backgroundColor = "#ffe6e6"; // 薄赤
      box.style.borderColor = "#ff4d4d";     // 赤い枠
    } else if (hasDelay) {
      // 遅延あり
      statusText.innerHTML = "⚠️ 一部の列車に遅れがあります。";
      box.style.backgroundColor = "#fff8e6"; // 薄黄色
      box.style.borderColor = "#ffcc00";     // 黄色の枠
    } else {
      // 全て運行中
      statusText.innerHTML = "✅ 現在運行しています。";
      box.style.backgroundColor = "#f8f8f8"; // 元の背景
      box.style.borderColor = "#e4e4e4";     // 元の枠

      const img = document.createElement("img");
      img.src = "https://raw.githubusercontent.com/kansinline/irukatrin.github.io/refs/heads/main/%E5%90%8D%E7%A7%B0%E6%9C%AA%E8%A8%AD%E5%AE%9A%E3%81%AE%E3%83%87%E3%82%B6%E3%82%A4%E3%83%B3.png";
      img.alt = "Delay Icon";
      img.style.width = "24px";
      img.style.height = "24px";
      img.style.marginRight = "10px";
      statusText.prepend(img);
    }

  } catch (err) {
    console.error("運行情報の取得に失敗しました:", err);
  }
}

// 初回チェック＋定期チェック（1分ごと）
checkTrainStatus();
setInterval(checkTrainStatus, 60000);

    "高野(佐田海洋鉄道)":"takano",
    "新拠点(佐田海洋鉄道)":"sinkyoten_sada",
    "マハル村":"maharumura_sada",
    "新拠点(kamui)":"Sinkyoten-kamui"
  };

  const input = document.getElementById("stationInput");
  const suggestions = document.getElementById("suggestions");

  // 入力時のサジェスト表示
  input.addEventListener("input", function () {
    const value = this.value.toLowerCase();
    suggestions.innerHTML = "";
    if (value === "") return;

    const stationList = Object.keys(stationRomajiMap);
    const filtered = stationList.filter(station =>
      station.toLowerCase().includes(value)
    );

    filtered.forEach(station => {
      const div = document.createElement("div");
      div.textContent = station;
      div.addEventListener("click", function () {
        input.value = station;
        suggestions.innerHTML = "";
      });
      suggestions.appendChild(div);
    });
  });

  // 外部クリックでサジェスト非表示
  document.addEventListener("click", function (e) {
    if (!document.getElementById("stationSearchForm").contains(e.target)) {
      suggestions.innerHTML = "";
    }
  });

  // 駅名検索送信イベント
  const form = document.getElementById('stationSearchForm');
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    const stationName = input.value.trim();
    const romaji = stationRomajiMap[stationName];

    if (romaji) {
      window.location.href = `https://irukatrin.dolphin.f5.si/station/${romaji}`;
    } else {
      alert("入力された駅名が見つかりません。");
    }
  });

  // スライダー機能
  const track = document.getElementById('sliderTrack');
  const slides = track.querySelectorAll('img');
  let currentIndex = 0;
  let intervalId;

  function updateSlide() {
    const slideWidth = slides[0].clientWidth;
    track.style.transform = `translateX(-${slideWidth * currentIndex}px)`;
  }

  function slideNext() {
    currentIndex = (currentIndex + 1) % slides.length;
    updateSlide();
  }

  function slidePrev() {
    currentIndex = (currentIndex - 1 + slides.length) % slides.length;
    updateSlide();
  }

  function startAutoSlide() {
    intervalId = setInterval(slideNext, 3000);
  }

  function stopAutoSlide() {
    clearInterval(intervalId);
  }

  startAutoSlide();
  document.getElementById('slider').addEventListener('mouseenter', stopAutoSlide);
  document.getElementById('slider').addEventListener('mouseleave', startAutoSlide);
  window.addEventListener('resize', updateSlide);

  // タブ切り替え
  const buttons = document.querySelectorAll('.tab-button');
  const contents = document.querySelectorAll('.tab-content');

  buttons.forEach(button => {
    button.addEventListener('click', () => {
      const target = button.dataset.tab;
      buttons.forEach(btn => btn.classList.remove('active'));
      contents.forEach(content => content.classList.remove('active'));
      button.classList.add('active');
      
document.getElementById(target).classList.add('active');
    });
  });
/* ===============================
   動的プレースホルダ処理
================================ */
function applyDynamicText(text) {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth() + 1;
  const day = now.getDate();
  const hour = now.getHours();
  const min = String(now.getMinutes()).padStart(2, "0");

  return text
    .replace(/{{YEAR}}/g, year)
    .replace(/{{MONTH}}/g, month)
    .replace(/{{DAY}}/g, day)
    .replace(/{{TIME}}/g, `${hour}:${min}`);
}

function applyAnniversary(text, openYear) {
  const now = new Date();
  const anniversary = now.getFullYear() - openYear;
  return text.replace(/{{ANNIVERSARY}}/g, anniversary);
}

/* ===============================
   アナウンス定義
================================ */
const announceEvents = [
{
    level: "normal",
    repeat: "yearly",
    start: "01-01T00:00",
    end: "01-01T23:59",
    message_ja: "{{YEAR}}年 あけましておめでとうございます。本年もいるか電鉄をご利用ください。",
    message_en: "Happy New Year {{YEAR}}. Thank you for using Iruka Railway."
  },
  {
    level: "normal",
    repeat: "always",
    message_ja: "いつもいるか電鉄をご利用いただきました誠にありがとうございます。今年でいるか電鉄は開業{{ANNIVERSARY}}周年を迎えました。",
    message_en: "Thank you for very much iruka Railway this year iruka Railway celebrates its {{ANNIVERSARY}}th anniversary.",
    openYear: 2025
  },
  {
    level: "emergency",
    repeat: "always",
    message_ja: "いつもイルカ電鉄をご利用頂きありがとうございます。アイテムを車内で投げる行為は、サーバーをラグくする原因になるのでやめましょう",
    message_en: "Thank you for using Iruka Dentetsu. Please refrain from throwing items inside the train as it may cause server lag.",
  }
];

/* ===============================
   時間判定（yearly対応）
================================ */
function isInTime(event, now) {
  if (event.repeat === "always") return true;

  let start, end;

  if (event.repeat === "yearly") {
    const y = now.getFullYear();
    start = new Date(`${y}-${event.start}`);
    end = new Date(`${y}-${event.end}`);
  } else {
    start = new Date(event.start);
    end = new Date(event.end);
  }

  return now >= start && now <= end;
}

/* ===============================
   スクロール → 終了後に言語切替
================================ */
function startScrollThenSwitch(textEl, wrapEl, ja, en) {
  let x = wrapEl.clientWidth;
  let lang = "ja";
  const speed = 1.5;
  let waiting = false;

  function loop() {
    if (!waiting) {
      x -= speed;
      textEl.style.transform = `translateX(${x}px)`;

      if (x < -textEl.scrollWidth) {
        waiting = true;
        setTimeout(() => {
          lang = lang === "ja" ? "en" : "ja";
          textEl.textContent = lang === "ja" ? ja : en;
          x = wrapEl.clientWidth;
          waiting = false;
        }, 1000);
      }
    }
    requestAnimationFrame(loop);
  }
  loop();
}

/* ===============================
   短文用：全文切替
================================ */
function startShortSwitch(textEl, ja, en) {
  let lang = "ja";
  setInterval(() => {
    lang = lang === "ja" ? "en" : "ja";
    textEl.textContent = lang === "ja" ? ja : en;
  }, 5000);
}

/* ===============================
   メイン描画処理
================================ */
function checkAnnounceMultiple() {
  const now = new Date();
  const area = document.getElementById("railinfo-announce-area");
  area.innerHTML = "";

  announceEvents.forEach(event => {
    if (!isInTime(event, now)) return;

    let ja = applyDynamicText(event.message_ja);
    let en = applyDynamicText(event.message_en);

    if (event.openYear) {
      ja = applyAnniversary(ja, event.openYear);
      en = applyAnniversary(en, event.openYear);
    }

    const box = document.createElement("div");
    box.className = `railinfo-announce announce-${event.level}`;

    const icon = document.createElement("span");
    icon.className = "icon";
    icon.textContent =
      event.level === "emergency" ? "🚨" :
      event.level === "caution"   ? "⚠️" : "📢";

    const wrap = document.createElement("div");
    wrap.className = "announce-text-wrap";

    const text = document.createElement("div");
    text.className = "announce-text";
    text.textContent = ja;

    wrap.appendChild(text);
    box.appendChild(icon);
    box.appendChild(wrap);
    area.appendChild(box);

    requestAnimationFrame(() => {
      if (text.scrollWidth > wrap.clientWidth) {
        startScrollThenSwitch(text, wrap, ja, en);
      } else {
        startShortSwitch(text, ja, en);
      }
    });
  });
}


/* ===============================
   起動
================================ */
checkAnnounceMultiple();
setInterval(checkAnnounceMultiple, 60000);
</script>
