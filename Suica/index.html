<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>カメレオン スイカゲーム 3D Pro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at center, #1b2838 0%, #0d121d 100%);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    #ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .interactive {
      pointer-events: auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .score-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 15px 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .score-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #94a3b8;
    }
    .score-value {
      font-size: 38px;
      font-weight: 800;
      color: #10b981;
      text-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
    }
    .next-container {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 12px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .next-title {
      font-size: 11px;
      color: #94a3b8;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    #next-canvas {
      width: 90px;
      height: 90px;
      display: block;
    }
    .evolution-chart {
      position: absolute;
      right: 20px;
      top: 130px;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      transition: opacity 0.3s ease, transform 0.3s ease;
      opacity: 0.15; /* プレイ中は邪魔にならないよう薄くする */
      pointer-events: none;
    }
    .evolution-chart:hover, .evolution-chart.show-fully {
      opacity: 1;
      pointer-events: auto;
    }
    .evo-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: #cbd5e1;
    }
    .evo-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      box-shadow: inset 0 -2px 4px rgba(0,0,0,0.4);
    }
    .controls-hint {
      text-align: center;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 24px;
      border-radius: 30px;
      align-self: center;
      margin-bottom: 10px;
      font-size: 13px;
      color: #e2e8f0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    #game-over-modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #game-over-modal.show {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      background: #0f172a;
      border: 2px solid #ef4444;
      padding: 40px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 0 50px rgba(239, 68, 68, 0.3);
      max-width: 420px;
      width: 90%;
    }
    .modal-title {
      font-size: 36px;
      font-weight: 900;
      color: #ef4444;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }
    .btn {
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      padding: 14px 36px;
      border-radius: 30px;
      cursor: pointer;
      margin-top: 24px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui-container">
    <header>
      <div class="score-panel">
        <div class="score-label">SCORE</div>
        <div class="score-value" id="score-val">0</div>
      </div>
      <div class="next-container interactive" id="evo-toggle-btn" title="リストを表示/非表示">
        <div class="next-title">NEXT FRUIT</div>
        <canvas id="next-canvas"></canvas>
      </div>
    </header>

    <div class="evolution-chart" id="evo-chart"></div>

    <div class="controls-hint">
      [操作] ドラッグ / スワイプで移動 ｜ [指を離す] または [Space] で落とす
    </div>
  </div>

  <div id="game-over-modal">
    <div class="modal-card">
      <div class="modal-title">GAME OVER</div>
      <p style="margin-bottom: 15px; color: #94a3b8; font-size: 14px;">フルーツがコンテナから溢れ出しました！</p>
      <div style="font-size: 20px; margin-bottom: 20px; color: #cbd5e1;">最終スコア: <span id="final-score" style="color:#10b981; font-weight:800; font-size: 28px;">0</span></div>
      <button class="btn interactive" onclick="resetGame()">もう一度挑戦する</button>
    </div>
  </div>

  <script>
    const FRUIT_TYPES = [
      { name: 'チェリー', radius: 0.45, color: 0xe11d48, points: 10, mass: 1.0, texType: 'cherry' },
      { name: 'イチゴ', radius: 0.65, color: 0xf43f5e, points: 20, mass: 1.3, texType: 'strawberry' },
      { name: 'ブドウ', radius: 0.9, color: 0x8b5cf6, points: 40, mass: 1.8, texType: 'grape' },
      { name: 'デコポン', radius: 1.15, color: 0xf97316, points: 80, mass: 2.5, texType: 'orange' },
      { name: '柿', radius: 1.45, color: 0xea580c, points: 160, mass: 3.4, texType: 'persimmon' },
      { name: 'リンゴ', radius: 1.8, color: 0xdc2626, points: 320, mass: 4.5, texType: 'apple' },
      { name: 'ナシ', radius: 2.2, color: 0xeab308, points: 640, mass: 6.0, texType: 'pear' },
      { name: 'モモ', radius: 2.65, color: 0xf472b6, points: 1280, mass: 8.0, texType: 'peach' },
      { name: 'パイナップル', radius: 3.15, color: 0xfacc15, points: 2560, mass: 10.5, texType: 'pineapple' },
      { name: 'メロン', radius: 3.7, color: 0x22c55e, points: 5120, mass: 13.5, texType: 'melon' },
      { name: 'スイカ', radius: 4.3, color: 0x15803d, points: 10240, mass: 17.0, texType: 'watermelon' }
    ];

    const CONTAINER_WIDTH = 10;
    const CONTAINER_HEIGHT = 14;
    const CONTAINER_DEPTH = 10;
    const DROP_Y = 5.5;
    const DAMPING = 0.96;
    const RESTITUTION = 0.15;

    let scene, camera, renderer;
    let fruits = [];
    let score = 0;
    let isGameOver = false;
    let canDrop = true;
    let currentFruitIndex = 0;
    let nextFruitIndex = 0;

    let aimX = 0;
    let aimZ = 0;
    let currentFruitMesh = null;
    let dropGuideMesh = null;
    let chameleonMesh, eyeLeft, eyeRight, tongueMesh;
    let tongueAnim = 0;

    const keys = { left: false, right: false };
    const textureCache = {};

    // タップ誤爆防止用の座標トラッキング
    let touchStartX = 0;
    let touchStartY = 0;
    let hasMovedSignificantly = false;

    const scoreValElem = document.getElementById('score-val');
    const finalScoreElem = document.getElementById('final-score');
    const gameOverModal = document.getElementById('game-over-modal');
    const nextCanvas = document.getElementById('next-canvas');
    let nextCtx = nextCanvas.getContext('2d');
    const evoChartElem = document.getElementById('evo-chart');

    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSound(type) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'drop') {
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.exponentialRampToValueAtTime(80, now + 0.18);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.18);
          osc.start(now);
          osc.stop(now + 0.18);
        } else if (type === 'merge') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(720, now + 0.22);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        }
      } catch (e) {}
    }

    function generateFruitTexture(type, colorHex) {
      if (textureCache[type]) return textureCache[type];
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const hexStr = '#' + colorHex.toString(16).padStart(6, '0');
      ctx.fillStyle = hexStr;
      ctx.fillRect(0, 0, 512, 512);

      if (type === 'watermelon') {
        ctx.fillStyle = '#06200a';
        for (let i = 0; i < 8; i++) {
          ctx.beginPath();
          const x = i * 64 + 10;
          ctx.moveTo(x, 0);
          for (let y = 0; y <= 512; y += 40) {
            ctx.lineTo(x + Math.sin(y * 0.05) * 20, y);
          }
          ctx.lineTo(x + 35, 512);
          for (let y = 512; y >= 0; y -= 40) {
            ctx.lineTo(x + 35 + Math.sin(y * 0.05) * 20, y);
          }
          ctx.closePath();
          ctx.fill();
        }
      } else if (type === 'strawberry') {
        ctx.fillStyle = '#fef08a';
        for (let y = 20; y < 512; y += 45) {
          const shift = (y / 45) % 2 === 0 ? 0 : 25;
          for (let x = 20 + shift; x < 512; x += 50) {
            ctx.beginPath();
            ctx.ellipse(x, y, 3, 6, 0, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      } else if (type === 'pineapple') {
        ctx.strokeStyle = '#854d0e';
        ctx.lineWidth = 6;
        for (let i = -512; i < 1024; i += 48) {
          ctx.beginPath();
          ctx.moveTo(i, 0); ctx.lineTo(i + 512, 512); ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(i, 512); ctx.lineTo(i + 512, 0); ctx.stroke();
        }
      } else if (type === 'melon') {
        ctx.strokeStyle = '#dcfce7';
        ctx.lineWidth = 4;
        ctx.globalAlpha = 0.6;
        for (let i = 0; i < 50; i++) {
          ctx.beginPath();
          ctx.arc(Math.random() * 512, Math.random() * 512, 20 + Math.random() * 40, 0, Math.PI * 2);
          ctx.stroke();
        }
      } else {
        const grad = ctx.createRadialGradient(256, 256, 20, 256, 256, 250);
        grad.addColorStop(0, 'rgba(255,255,255,0.2)');
        grad.addColorStop(1, 'rgba(0,0,0,0.25)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 512, 512);
      }

      const texture = new THREE.CanvasTexture(canvas);
      textureCache[type] = texture;
      return texture;
    }

    function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0f1d);
      scene.fog = new THREE.FogExp2(0x0a0f1d, 0.012);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 6, 27);
      camera.lookAt(0, -1, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(12, 24, 16);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      scene.add(dirLight);

      const rimLight = new THREE.PointLight(0x10b981, 0.8, 40);
      rimLight.position.set(-15, 10, -10);
      scene.add(rimLight);

      createContainer();
      createChameleon();
      createDropGuide();
      buildEvoChart();

      nextCanvas.width = 90;
      nextCanvas.height = 90;

      // Listeners (Pointer Events for robust mouse/touch handling)
      window.addEventListener('resize', onWindowResize);
      window.addEventListener('pointerdown', onPointerDown);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);
      window.addEventListener('keydown', onKeyDown);
      window.addEventListener('keyup', onKeyUp);

      // リスト部分にホバー/タップしたときに一時的にリストを全表示にする
      document.getElementById('evo-toggle-btn').addEventListener('mouseenter', () => evoChartElem.classList.add('show-fully'));
      document.getElementById('evo-toggle-btn').addEventListener('mouseleave', () => evoChartElem.classList.remove('show-fully'));
      evoChartElem.addEventListener('mouseenter', () => evoChartElem.classList.add('show-fully'));
      evoChartElem.addEventListener('mouseleave', () => evoChartElem.classList.remove('show-fully'));

      currentFruitIndex = getRandomStartFruit();
      nextFruitIndex = getRandomStartFruit();
      updateNextCanvas();
      updateHoldFruitMesh();

      animate();
    }

    function createContainer() {
      const wallMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff, transparent: true, opacity: 0.18, roughness: 0.05, transmission: 0.92, thickness: 1.5, clearcoat: 1.0
      });
      const frameMat = new THREE.MeshStandardMaterial({ color: 0x10b981, emissive: 0x022c22, roughness: 0.3, metalness: 0.8 });

      const bottom = new THREE.Mesh(new THREE.BoxGeometry(CONTAINER_WIDTH, 0.4, CONTAINER_DEPTH), wallMat);
      bottom.position.y = -CONTAINER_HEIGHT / 2;
      bottom.receiveShadow = true;
      scene.add(bottom);

      const sideG = new THREE.BoxGeometry(0.4, CONTAINER_HEIGHT, CONTAINER_DEPTH);
      const leftWall = new THREE.Mesh(sideG, wallMat); leftWall.position.set(-CONTAINER_WIDTH / 2, 0, 0); scene.add(leftWall);
      const rightWall = new THREE.Mesh(sideG, wallMat); rightWall.position.set(CONTAINER_WIDTH / 2, 0, 0); scene.add(rightWall);
      const backWall = new THREE.Mesh(new THREE.BoxGeometry(CONTAINER_WIDTH, CONTAINER_HEIGHT, 0.4), wallMat); backWall.position.set(0, 0, -CONTAINER_DEPTH / 2); scene.add(backWall);

      const grid = new THREE.GridHelper(40, 20, 0x10b981, 0x1e293b);
      grid.position.y = -CONTAINER_HEIGHT / 2 - 0.2;
      scene.add(grid);
    }

    function createChameleon() {
      const chamGroup = new THREE.Group();
      const skinMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.3, metalness: 0.1 });

      const body = new THREE.Mesh(new THREE.SphereGeometry(1.4, 24, 24).scale(1.3, 0.95, 0.95), skinMat);
      chamGroup.add(body);

      const head = new THREE.Mesh(new THREE.ConeGeometry(1.1, 2.2, 20).rotateX(-Math.PI / 2), skinMat);
      head.position.set(0, 0.2, 1.2);
      chamGroup.add(head);

      const crest = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.6, 12), skinMat);
      crest.position.set(0, 1.3, 0.8); crest.rotation.x = -0.4;
      chamGroup.add(crest);

      const eyeMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.1 });
      const eyeBaseG = new THREE.SphereGeometry(0.45, 16, 16);

      eyeLeft = new THREE.Group();
      eyeLeft.add(new THREE.Mesh(eyeBaseG, skinMat), Object.assign(new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 12), eyeMat), { position: new THREE.Vector3(0, 0, 0.35) }));
      eyeLeft.position.set(-0.95, 0.5, 1.4);

      eyeRight = eyeLeft.clone();
      eyeRight.position.set(0.95, 0.5, 1.4);
      chamGroup.add(eyeLeft, eyeRight);

      tongueMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1, 12), new THREE.MeshBasicMaterial({ color: 0xf43f5e }));
      tongueMesh.rotation.x = Math.PI / 2;
      tongueMesh.position.set(0, -0.1, 1.8);
      tongueMesh.scale.set(1, 0.01, 1);
      chamGroup.add(tongueMesh);

      chamGroup.position.set(0, DROP_Y + 3.2, 0);
      scene.add(chamGroup);
      chameleonMesh = chamGroup;
    }

    function createDropGuide() {
      dropGuideMesh = new THREE.Mesh(
        new THREE.CylinderGeometry(0.08, 0.08, CONTAINER_HEIGHT, 12),
        new THREE.MeshBasicMaterial({ color: 0x10b981, transparent: true, opacity: 0.3 })
      );
      scene.add(dropGuideMesh);
    }

    function createFruitMesh(index) {
      const def = FRUIT_TYPES[index];
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(def.radius, 32, 32),
        new THREE.MeshStandardMaterial({ map: generateFruitTexture(def.texType, def.color), roughness: 0.35, metalness: 0.05 })
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, def.radius * 0.35, 8), new THREE.MeshStandardMaterial({ color: 0x451a03, roughness: 0.8 }));
      stem.position.y = def.radius;
      mesh.add(stem);

      return mesh;
    }

    function updateHoldFruitMesh() {
      if (currentFruitMesh) scene.remove(currentFruitMesh);
      if (!isGameOver) {
        currentFruitMesh = createFruitMesh(currentFruitIndex);
        currentFruitMesh.position.set(aimX, DROP_Y, aimZ);
        scene.add(currentFruitMesh);
      }
    }

    function getRandomStartFruit() {
      return Math.floor(Math.random() * 4);
    }

    function spawnFruit() {
      if (!canDrop || isGameOver) return;

      playSound('drop');
      canDrop = false;
      tongueAnim = 1.0;

      const typeIndex = currentFruitIndex;
      const def = FRUIT_TYPES[typeIndex];

      if (currentFruitMesh) {
        scene.remove(currentFruitMesh);
        currentFruitMesh = null;
      }

      const mesh = createFruitMesh(typeIndex);
      mesh.position.set(aimX, DROP_Y, aimZ);
      scene.add(mesh);

      fruits.push({
        mesh: mesh, type: typeIndex, radius: def.radius, mass: def.mass,
        pos: mesh.position, vel: new THREE.Vector3(0, -2, 0), isMergerTarget: false, spawnTime: Date.now()
      });

      currentFruitIndex = nextFruitIndex;
      nextFruitIndex = getRandomStartFruit();
      updateNextCanvas();

      setTimeout(() => {
        canDrop = true;
        updateHoldFruitMesh();
      }, 550);
    }

    function updatePhysics(dt) {
      const gravity = -32.0;
      const subSteps = 4;
      const subDt = dt / subSteps;

      for (let step = 0; step < subSteps; step++) {
        for (let i = 0; i < fruits.length; i++) {
          const f = fruits[i];
          f.vel.y += gravity * subDt;
          f.pos.addScaledVector(f.vel, subDt);

          const minY = -CONTAINER_HEIGHT / 2 + f.radius;
          if (f.pos.y < minY) {
            f.pos.y = minY;
            f.vel.y = -f.vel.y * RESTITUTION;
            f.vel.x *= DAMPING; f.vel.z *= DAMPING;
          }

          const maxX = CONTAINER_WIDTH / 2 - f.radius;
          if (Math.abs(f.pos.x) > maxX) {
            f.pos.x = Math.sign(f.pos.x) * maxX;
            f.vel.x = -f.vel.x * RESTITUTION; f.vel.z *= DAMPING;
          }

          const maxZ = CONTAINER_DEPTH / 2 - f.radius;
          if (Math.abs(f.pos.z) > maxZ) {
            f.pos.z = Math.sign(f.pos.z) * maxZ;
            f.vel.z = -f.vel.z * RESTITUTION; f.vel.x *= DAMPING;
          }

          f.mesh.position.copy(f.pos);
        }

        for (let i = 0; i < fruits.length; i++) {
          for (let j = i + 1; j < fruits.length; j++) {
            const f1 = fruits[i];
            const f2 = fruits[j];
            if (!f1 || !f2 || f1.isMergerTarget || f2.isMergerTarget) continue;

            const delta = new THREE.Vector3().subVectors(f2.pos, f1.pos);
            const dist = delta.length();
            const minDist = f1.radius + f2.radius;

            if (dist < minDist && dist > 0.0001) {
              if (f1.type === f2.type && f1.type < FRUIT_TYPES.length - 1) {
                f1.isMergerTarget = true; f2.isMergerTarget = true;
                mergeFruits(i, j);
                return;
              }

              const normal = delta.normalize();
              const overlap = minDist - dist;
              f1.pos.addScaledVector(normal, -overlap * 0.5);
              f2.pos.addScaledVector(normal, overlap * 0.5);

              const relativeVel = new THREE.Vector3().subVectors(f2.vel, f1.vel);
              const velAlongNormal = relativeVel.dot(normal);

              if (velAlongNormal < 0) {
                const impulse = -(1 + RESTITUTION) * velAlongNormal / (1 / f1.mass + 1 / f2.mass);
                f1.vel.addScaledVector(normal, -impulse / f1.mass);
                f2.vel.addScaledVector(normal, impulse / f2.mass);
              }
            }
          }
        }
      }

      if (!isGameOver) {
        const now = Date.now();
        for (let f of fruits) {
          if (now - f.spawnTime > 1500 && f.pos.y > DROP_Y - 1.2 && f.vel.lengthSq() < 0.2) {
            triggerGameOver();
            break;
          }
        }
      }
    }

    function mergeFruits(idx1, idx2) {
      const f1 = fruits[idx1];
      const f2 = fruits[idx2];
      const newType = f1.type + 1;
      const newPos = new THREE.Vector3().addVectors(f1.pos, f2.pos).multiplyScalar(0.5);

      scene.remove(f1.mesh); scene.remove(f2.mesh);
      fruits = fruits.filter((_, idx) => idx !== idx1 && idx !== idx2);

      score += FRUIT_TYPES[newType].points;
      scoreValElem.innerText = score;
      playSound('merge');

      const mesh = createFruitMesh(newType);
      mesh.position.copy(newPos);
      scene.add(mesh);

      fruits.push({
        mesh: mesh, type: newType, radius: FRUIT_TYPES[newType].radius, mass: FRUIT_TYPES[newType].mass,
        pos: mesh.position, vel: new THREE.Vector3(0, 1.5, 0), isMergerTarget: false, spawnTime: Date.now()
      });
    }

    function updateAimX(targetX) {
      if (isGameOver) return;
      const currentRadius = FRUIT_TYPES[currentFruitIndex].radius;
      const limitX = CONTAINER_WIDTH / 2 - currentRadius;
      aimX = Math.max(-limitX, Math.min(limitX, targetX));

      if (chameleonMesh) chameleonMesh.position.x = aimX;
      if (dropGuideMesh) dropGuideMesh.position.x = aimX;
      if (currentFruitMesh) currentFruitMesh.position.x = aimX;
    }

    // --- 誤爆防止のポインター操作 ---
    function onPointerDown(e) {
      if (e.target.closest('.interactive') || isGameOver) return;
      initAudio();
      touchStartX = e.clientX;
      touchStartY = e.clientY;
      hasMovedSignificantly = false;

      const mouseX = (e.clientX / window.innerWidth) * 2 - 1;
      updateAimX(mouseX * (CONTAINER_WIDTH / 2));
    }

    function onPointerMove(e) {
      const mouseX = (e.clientX / window.innerWidth) * 2 - 1;
      updateAimX(mouseX * (CONTAINER_WIDTH / 2));

      if (Math.abs(e.clientX - touchStartX) > 10 || Math.abs(e.clientY - touchStartY) > 10) {
        hasMovedSignificantly = true;
      }

      if (eyeLeft && eyeRight) {
        eyeLeft.rotation.y = mouseX * 0.9;
        eyeRight.rotation.y = mouseX * 0.9;
      }
    }

    function onPointerUp(e) {
      if (e.target.closest('.interactive') || isGameOver) return;
      // タップが大きく動いておらず、UI以外の上であれば指を離した瞬間にドロップ
      spawnFruit();
    }

    function onKeyDown(e) {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
      if (e.key === ' ' || e.key === 'Enter') {
        initAudio();
        spawnFruit();
      }
    }

    function onKeyUp(e) {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    }

    function processKeyboardInput(dt) {
      if (keys.left || keys.right) {
        const speed = 12.0 * dt;
        let newX = aimX;
        if (keys.left) newX -= speed;
        if (keys.right) newX += speed;
        updateAimX(newX);
      }
    }

    function updateNextCanvas() {
      nextCtx.clearRect(0, 0, 90, 90);
      const def = FRUIT_TYPES[nextFruitIndex];
      nextCtx.beginPath();
      nextCtx.arc(45, 45, Math.min(32, def.radius * 9 + 10), 0, Math.PI * 2);
      nextCtx.fillStyle = '#' + def.color.toString(16).padStart(6, '0');
      nextCtx.fill();
      nextCtx.lineWidth = 3;
      nextCtx.strokeStyle = 'rgba(255,255,255,0.8)';
      nextCtx.stroke();
    }

    function buildEvoChart() {
      evoChartElem.innerHTML = '';
      FRUIT_TYPES.forEach(f => {
        const item = document.createElement('div');
        item.className = 'evo-item';
        const dot = document.createElement('div');
        dot.className = 'evo-dot';
        dot.style.backgroundColor = '#' + f.color.toString(16).padStart(6, '0');
        const label = document.createElement('span');
        label.innerText = f.name;
        item.appendChild(dot);
        item.appendChild(label);
        evoChartElem.appendChild(item);
      });
    }

    function triggerGameOver() {
      isGameOver = true;
      finalScoreElem.innerText = score;
      gameOverModal.classList.add('show');
      evoChartElem.classList.add('show-fully'); // ゲームオーバー時はリストをしっかり見せる
    }

    function resetGame() {
      fruits.forEach(f => scene.remove(f.mesh));
      fruits = [];
      score = 0;
      scoreValElem.innerText = score;
      isGameOver = false;
      canDrop = true;
      gameOverModal.classList.remove('show');
      evoChartElem.classList.remove('show-fully');

      currentFruitIndex = getRandomStartFruit();
      nextFruitIndex = getRandomStartFruit();
      updateNextCanvas();
      updateHoldFruitMesh();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.033);

      processKeyboardInput(dt);

      if (!isGameOver) {
        updatePhysics(dt);
      }

      if (tongueAnim > 0 && tongueMesh) {
        tongueAnim -= dt * 4.0;
        const scaleZ = Math.sin(Math.max(0, tongueAnim) * Math.PI) * 2.5;
        tongueMesh.scale.set(1, Math.max(0.01, scaleZ), 1);
      }

      if (chameleonMesh) {
        chameleonMesh.position.y = DROP_Y + 3.2 + Math.sin(Date.now() * 0.0025) * 0.12;
      }

      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
