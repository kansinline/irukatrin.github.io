<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カメレオン スイカゲーム 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    #ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .interactive {
      pointer-events: auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .score-panel {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 15px 25px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .score-label {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #aaa;
    }
    .score-value {
      font-size: 36px;
      font-weight: 800;
      color: #00ffcc;
      text-shadow: 0 0 10px rgba(0,255,204,0.5);
    }
    .next-container {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 10px 20px;
      text-align: center;
    }
    .next-title {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 5px;
    }
    #next-canvas {
      width: 80px;
      height: 80px;
    }
    .evolution-chart {
      position: absolute;
      right: 20px;
      top: 120px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: center;
    }
    .evo-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    .evo-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }
    .controls-hint {
      text-align: center;
      background: rgba(0,0,0,0.5);
      padding: 8px 16px;
      border-radius: 20px;
      align-self: center;
      margin-bottom: 10px;
      font-size: 14px;
    }
    #game-over-modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
    #game-over-modal.show {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      background: #222;
      border: 3px solid #ff0055;
      padding: 40px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 0, 85, 0.5);
      max-width: 400px;
      width: 90%;
    }
    .modal-title {
      font-size: 42px;
      color: #ff0055;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .btn {
      background: linear-gradient(45deg, #00ffcc, #0099ff);
      border: none;
      color: #000;
      font-weight: bold;
      font-size: 18px;
      padding: 12px 32px;
      border-radius: 30px;
      cursor: pointer;
      margin-top: 20px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(0, 255, 204, 0.8);
    }
  </style>
  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui-container">
    <header>
      <div class="score-panel">
        <div class="score-label">SCORE</div>
        <div class="score-value" id="score-val">0</div>
      </div>
      <div class="next-container">
        <div class="next-title">NEXT FRUIT</div>
        <canvas id="next-canvas"></canvas>
      </div>
    </header>

    <div class="evolution-chart" id="evo-chart"></div>

    <div class="controls-hint">
      マウス / タップ移動で狙いを定め、クリック / リリースで落とす！
    </div>
  </div>

  <div id="game-over-modal">
    <div class="modal-card">
      <div class="modal-title">GAME OVER</div>
      <p style="margin-bottom: 15px; color: #ccc;">容器からフルーツがあふれ出しました！</p>
      <div style="font-size: 20px; margin-bottom: 20px;">最終スコア: <span id="final-score" style="color:#00ffcc; font-weight:bold;">0</span></div>
      <button class="btn interactive" onclick="resetGame()">もう一度プレイ</button>
    </div>
  </div>

  <script>
    // --- FRUIT DEFINITIONS ---
    const FRUIT_TYPES = [
      { name: 'チェリー', radius: 0.4, color: 0xff0044, points: 10, mass: 1 },
      { name: 'イチゴ', radius: 0.6, color: 0xff3366, points: 20, mass: 1.5 },
      { name: 'ブドウ', radius: 0.85, color: 0x9933ff, points: 40, mass: 2 },
      { name: 'デコポン', radius: 1.1, color: 0xff9900, points: 80, mass: 2.8 },
      { name: '柿', radius: 1.4, color: 0xff6600, points: 160, mass: 3.8 },
      { name: 'リンゴ', radius: 1.75, color: 0xee0000, points: 320, mass: 5.0 },
      { name: 'ナシ', radius: 2.15, color: 0xdddd33, points: 640, mass: 6.5 },
      { name: 'モモ', radius: 2.6, color: 0xff99bb, points: 1280, mass: 8.5 },
      { name: 'パイナップル', radius: 3.1, color: 0xffcc00, points: 2560, mass: 11.0 },
      { name: 'メロン', radius: 3.7, color: 0x66ff33, points: 5120, mass: 14.0 },
      { name: 'スイカ', radius: 4.4, color: 0x00aa33, points: 10240, mass: 18.0 }
    ];

    // --- GAME CONSTANTS & GLOBALS ---
    const CONTAINER_WIDTH = 10;
    const CONTAINER_HEIGHT = 14;
    const CONTAINER_DEPTH = 10;
    const DROP_Y = 6;
    const DAMPING = 0.98;
    const RESTITUTION = 0.2;

    let scene, camera, renderer;
    let fruits = [];
    let score = 0;
    let isGameOver = false;
    let canDrop = true;
    let currentFruitIndex = 0;
    let nextFruitIndex = 0;

    // Controls
    let aimX = 0;
    let aimZ = 0;
    let dropGuideMesh;
    let chameleonMesh, eyeLeft, eyeRight, tongueMesh;

    // UI Elements
    const scoreValElem = document.getElementById('score-val');
    const finalScoreElem = document.getElementById('final-score');
    const gameOverModal = document.getElementById('game-over-modal');
    const nextCanvas = document.getElementById('next-canvas');
    let nextCtx = nextCanvas.getContext('2d');

    // Audio Context (Synthesized Sounds)
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playSound(type) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;
        if (type === 'drop') {
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        } else if (type === 'merge') {
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        }
      } catch (e) {}
    }

    // --- SETUP THREE.JS SCENE ---
    function init() {
      const container = document.getElementById('canvas-container');
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f172a);
      scene.fog = new THREE.FogExp2(0x0f172a, 0.015);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 5, 28);
      camera.lookAt(0, -1, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(15, 25, 15);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.camera.near = 0.5;
      dirLight.shadow.camera.far = 50;
      const d = 15;
      dirLight.shadow.camera.left = -d;
      dirLight.shadow.camera.right = d;
      dirLight.shadow.camera.top = d;
      dirLight.shadow.camera.bottom = -d;
      scene.add(dirLight);

      const pointLight = new THREE.PointLight(0x00ffcc, 0.5, 30);
      pointLight.position.set(0, -5, 5);
      scene.add(pointLight);

      // Build Environment
      createContainer();
      createChameleon();
      createDropGuide();
      buildEvoChart();

      // Next Canvas setup
      nextCanvas.width = 80;
      nextCanvas.height = 80;

      // Event Listeners
      window.addEventListener('resize', onWindowResize);
      window.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerdown', onPointerDown);

      // Initialize Fruit Selection
      currentFruitIndex = getRandomStartFruit();
      nextFruitIndex = getRandomStartFruit();
      updateNextCanvas();

      animate();
    }

    // --- GLASS CONTAINER ---
    function createContainer() {
      const wallMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.2,
        roughness: 0.1,
        transmission: 0.9,
        thickness: 1.2,
        clearcoat: 1.0
      });

      const frameMat = new THREE.MeshStandardMaterial({
        color: 0x00ffcc,
        emissive: 0x003322,
        roughness: 0.2,
        metalness: 0.8
      });

      // Bottom
      const bottomG = new THREE.BoxGeometry(CONTAINER_WIDTH, 0.4, CONTAINER_DEPTH);
      const bottom = new THREE.Mesh(bottomG, wallMat);
      bottom.position.y = -CONTAINER_HEIGHT / 2;
      bottom.receiveShadow = true;
      scene.add(bottom);

      // Walls (Left, Right, Back, Front)
      const sideG = new THREE.BoxGeometry(0.4, CONTAINER_HEIGHT, CONTAINER_DEPTH);
      const leftWall = new THREE.Mesh(sideG, wallMat);
      leftWall.position.set(-CONTAINER_WIDTH / 2, 0, 0);
      scene.add(leftWall);

      const rightWall = new THREE.Mesh(sideG, wallMat);
      rightWall.position.set(CONTAINER_WIDTH / 2, 0, 0);
      scene.add(rightWall);

      const backG = new THREE.BoxGeometry(CONTAINER_WIDTH, CONTAINER_HEIGHT, 0.4);
      const backWall = new THREE.Mesh(backG, wallMat);
      backWall.position.set(0, 0, -CONTAINER_DEPTH / 2);
      scene.add(backWall);

      // Neon Frame Edges
      const edgeG = new THREE.BoxGeometry(0.3, CONTAINER_HEIGHT, 0.3);
      [-CONTAINER_WIDTH/2, CONTAINER_WIDTH/2].forEach(x => {
        [-CONTAINER_DEPTH/2, CONTAINER_DEPTH/2].forEach(z => {
          const edge = new THREE.Mesh(edgeG, frameMat);
          edge.position.set(x, 0, z);
          scene.add(edge);
        });
      });
    }

    // --- CHAMELEON CHARACTER ---
    function createChameleon() {
      const chamGroup = new THREE.Group();

      const skinMat = new THREE.MeshStandardMaterial({
        color: 0x22cc55,
        roughness: 0.4,
        metalness: 0.1
      });

      // Body
      const bodyG = new THREE.SphereGeometry(1.5, 16, 16);
      bodyG.scale(1.2, 0.9, 0.9);
      const body = new THREE.Mesh(bodyG, skinMat);
      chamGroup.add(body);

      // Head
      const headG = new THREE.ConeGeometry(1.2, 2, 16);
      headG.rotateX(-Math.PI / 2);
      const head = new THREE.Mesh(headG, skinMat);
      head.position.set(0, 0.2, 1.2);
      chamGroup.add(head);

      // Crest (Crest on Head)
      const crestG = new THREE.ConeGeometry(0.5, 1.5, 8);
      const crest = new THREE.Mesh(crestG, skinMat);
      crest.position.set(0, 1.2, 0.8);
      crest.rotation.x = -0.5;
      chamGroup.add(crest);

      // Eyes
      const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });
      const eyeBaseG = new THREE.SphereGeometry(0.45, 12, 12);
      
      eyeLeft = new THREE.Group();
      const eLMesh = new THREE.Mesh(eyeBaseG, skinMat);
      const pupilL = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), eyeMat);
      pupilL.position.z = 0.35;
      eyeLeft.add(eLMesh, pupilL);
      eyeLeft.position.set(-1.0, 0.5, 1.4);

      eyeRight = eyeLeft.clone();
      eyeRight.position.set(1.0, 0.5, 1.4);

      chamGroup.add(eyeLeft, eyeRight);

      // Position Chameleon Above Container
      chamGroup.position.set(0, DROP_Y + 3.5, 0);
      scene.add(chamGroup);
      chameleonMesh = chamGroup;
    }

    // --- DROP GUIDE INDICATOR ---
    function createDropGuide() {
      const guideG = new THREE.CylinderGeometry(0.1, 0.1, CONTAINER_HEIGHT, 8);
      const guideMat = new THREE.MeshBasicMaterial({
        color: 0x00ffcc,
        transparent: true,
        opacity: 0.35
      });
      dropGuideMesh = new THREE.Mesh(guideG, guideMat);
      dropGuideMesh.position.y = 0;
      scene.add(dropGuideMesh);
    }

    // --- FRUIT CREATION ---
    function createFruitMesh(index) {
      const def = FRUIT_TYPES[index];
      const geo = new THREE.SphereGeometry(def.radius, 32, 32);
      
      let mat;
      if (index === 10) { // Watermelon Texture Effect
        mat = new THREE.MeshStandardMaterial({
          color: def.color,
          roughness: 0.3,
          metalness: 0.1
        });
      } else {
        mat = new THREE.MeshStandardMaterial({
          color: def.color,
          roughness: 0.4,
          metalness: 0.1
        });
      }

      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      // Add Stem
      const stemG = new THREE.CylinderGeometry(0.04, 0.04, def.radius * 0.4);
      const stemMat = new THREE.MeshBasicMaterial({ color: 0x332211 });
      const stem = new THREE.Mesh(stemG, stemMat);
      stem.position.y = def.radius;
      mesh.add(stem);

      return mesh;
    }

    function getRandomStartFruit() {
      return Math.floor(Math.random() * 4); // Only small fruits initially
    }

    function spawnFruit(x, z, typeIndex) {
      const def = FRUIT_TYPES[typeIndex];
      const mesh = createFruitMesh(typeIndex);
      mesh.position.set(x, DROP_Y, z);
      scene.add(mesh);

      const fruitObj = {
        mesh: mesh,
        type: typeIndex,
        radius: def.radius,
        mass: def.mass,
        pos: mesh.position,
        vel: new THREE.Vector3(0, 0, 0),
        isMergerTarget: false
      };

      fruits.push(fruitObj);
      playSound('drop');
    }

    // --- SIMULATION & PHYSICS ENGINE ---
    function updatePhysics(dt) {
      const gravity = -28.0;

      // Integration & Boundary Constraints
      for (let i = 0; i < fruits.length; i++) {
        const f = fruits[i];

        // Apply Gravity
        f.vel.y += gravity * dt;

        // Update Position
        f.pos.addScaledVector(f.vel, dt);

        // Container Floor Collision
        const minY = -CONTAINER_HEIGHT / 2 + f.radius;
        if (f.pos.y < minY) {
          f.pos.y = minY;
          f.vel.y = -f.vel.y * RESTITUTION;
          f.vel.x *= DAMPING;
          f.vel.z *= DAMPING;
        }

        // Walls Collision
        const maxX = CONTAINER_WIDTH / 2 - f.radius;
        if (Math.abs(f.pos.x) > maxX) {
          f.pos.x = Math.sign(f.pos.x) * maxX;
          f.vel.x = -f.vel.x * RESTITUTION;
        }

        const maxZ = CONTAINER_DEPTH / 2 - f.radius;
        if (Math.abs(f.pos.z) > maxZ) {
          f.pos.z = Math.sign(f.pos.z) * maxZ;
          f.vel.z = -f.vel.z * RESTITUTION;
        }

        f.mesh.position.copy(f.pos);
      }

      // Sphere to Sphere Collisions & Merging
      for (let i = 0; i < fruits.length; i++) {
        for (let j = i + 1; j < fruits.length; j++) {
          const f1 = fruits[i];
          const f2 = fruits[j];

          if (!f1 || !f2 || f1.isMergerTarget || f2.isMergerTarget) continue;

          const delta = new THREE.Vector3().subVectors(f2.pos, f1.pos);
          const dist = delta.length();
          const minDist = f1.radius + f2.radius;

          if (dist < minDist) {
            // Check Merge
            if (f1.type === f2.type && f1.type < FRUIT_TYPES.length - 1) {
              f1.isMergerTarget = true;
              f2.isMergerTarget = true;
              mergeFruits(i, j);
              return; // Break frame iteration to avoid array mutation conflicts
            }

            // Normal Elastic Collision
            const normal = delta.normalize();
            const overlap = minDist - dist;

            // Separate
            f1.pos.addScaledVector(normal, -overlap * 0.5);
            f2.pos.addScaledVector(normal, overlap * 0.5);

            // Relative Velocity
            const relativeVel = new THREE.Vector3().subVectors(f2.vel, f1.vel);
            const velAlongNormal = relativeVel.dot(normal);

            if (velAlongNormal < 0) {
              const impulse = -(1 + RESTITUTION) * velAlongNormal / (1 / f1.mass + 1 / f2.mass);
              f1.vel.addScaledVector(normal, -impulse / f1.mass);
              f2.vel.addScaledVector(normal, impulse / f2.mass);
            }
          }
        }
      }

      // Check Game Over Condition
      if (!isGameOver) {
        for (let f of fruits) {
          if (f.pos.y > DROP_Y - 1 && f.vel.lengthSq() < 0.1) {
            triggerGameOver();
            break;
          }
        }
      }
    }

    // --- MERGE FRUITS LOGIC ---
    function mergeFruits(idx1, idx2) {
      const f1 = fruits[idx1];
      const f2 = fruits[idx2];

      const newType = f1.type + 1;
      const newPos = new THREE.Vector3().addVectors(f1.pos, f2.pos).multiplyScalar(0.5);

      // Remove Old
      scene.remove(f1.mesh);
      scene.remove(f2.mesh);

      fruits = fruits.filter((_, idx) => idx !== idx1 && idx !== idx2);

      // Add Score & Sound
      score += FRUIT_TYPES[newType].points;
      scoreValElem.innerText = score;
      playSound('merge');

      // Spawn Upgraded Fruit
      const mesh = createFruitMesh(newType);
      mesh.position.copy(newPos);
      scene.add(mesh);

      fruits.push({
        mesh: mesh,
        type: newType,
        radius: FRUIT_TYPES[newType].radius,
        mass: FRUIT_TYPES[newType].mass,
        pos: mesh.position,
        vel: new THREE.Vector3(0, 2, 0), // Slight pop up
        isMergerTarget: false
      });
    }

    // --- CONTROLS & INTERACTION ---
    function onPointerMove(e) {
      if (isGameOver) return;

      const mouseX = (e.clientX / window.innerWidth) * 2 - 1;
      const r = FRUIT_TYPES[currentFruitIndex].radius;
      const limitX = CONTAINER_WIDTH / 2 - r;

      aimX = mouseX * (CONTAINER_WIDTH / 2);
      aimX = Math.max(-limitX, Math.min(limitX, aimX));

      if (chameleonMesh) {
        chameleonMesh.position.x = aimX;
      }
      if (dropGuideMesh) {
        dropGuideMesh.position.x = aimX;
      }

      // Chameleon Eye Animation (Look at Cursor)
      if (eyeLeft && eyeRight) {
        eyeLeft.rotation.y = mouseX * 0.8;
        eyeLeft.rotation.x = Math.sin(Date.now() * 0.003) * 0.3;
        eyeRight.rotation.y = mouseX * 0.8;
        eyeRight.rotation.x = Math.cos(Date.now() * 0.003) * 0.3;
      }
    }

    function onPointerDown(e) {
      if (e.target.closest('.interactive') || isGameOver || !canDrop) return;

      initAudio();

      // Drop Fruit
      spawnFruit(aimX, aimZ, currentFruitIndex);

      canDrop = false;
      currentFruitIndex = nextFruitIndex;
      nextFruitIndex = getRandomStartFruit();
      updateNextCanvas();

      setTimeout(() => {
        canDrop = true;
      }, 500);
    }

    // --- UI UPDATES ---
    function updateNextCanvas() {
      nextCtx.clearRect(0, 0, 80, 80);
      const def = FRUIT_TYPES[nextFruitIndex];

      nextCtx.beginPath();
      nextCtx.arc(40, 40, Math.min(28, def.radius * 10 + 8), 0, Math.PI * 2);
      nextCtx.fillStyle = '#' + def.color.toString(16).padStart(6, '0');
      nextCtx.fill();
      nextCtx.lineWidth = 3;
      nextCtx.strokeStyle = '#ffffff';
      nextCtx.stroke();
    }

    function buildEvoChart() {
      const chart = document.getElementById('evo-chart');
      FRUIT_TYPES.forEach(f => {
        const item = document.createElement('div');
        item.className = 'evo-item';
        
        const dot = document.createElement('div');
        dot.className = 'evo-dot';
        dot.style.backgroundColor = '#' + f.color.toString(16).padStart(6, '0');

        const label = document.createElement('span');
        label.innerText = f.name;

        item.appendChild(dot);
        item.appendChild(label);
        chart.appendChild(item);
      });
    }

    function triggerGameOver() {
      isGameOver = true;
      finalScoreElem.innerText = score;
      gameOverModal.classList.add('show');
    }

    function resetGame() {
      fruits.forEach(f => scene.remove(f.mesh));
      fruits = [];
      score = 0;
      scoreValElem.innerText = score;
      isGameOver = false;
      canDrop = true;
      gameOverModal.classList.remove('show');
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // --- MAIN ANIMATION LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.033); // Cap dt to prevent tunneling
      if (!isGameOver) {
        updatePhysics(dt);
      }

      // Subtle Chameleon Idle Animation
      if (chameleonMesh) {
        chameleonMesh.position.y = DROP_Y + 3.5 + Math.sin(Date.now() * 0.002) * 0.15;
      }

      renderer.render(scene, camera);
    }

    // Start App
    window.onload = init;
  </script>
</body>
</html>
